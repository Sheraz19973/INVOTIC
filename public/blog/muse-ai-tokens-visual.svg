<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Muse AI invite code — get 1 billion free tokens</title>
  <desc id="svgDesc">Step-by-step guide to redeem a Muse AI invite code and claim 1 billion free Meta Muse tokens. By INVOTIC.</desc>
  <defs>
    <radialGradient id="violetGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#00f2ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00f2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tokenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f2ff"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.015"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a0e1a"/>
  <rect width="1200" height="630" fill="url(#violetGlow)"/>
  <rect width="1200" height="630" fill="url(#cyanGlow)"/>

  <!-- token coin -->
  <g transform="translate(600,225)">
    <circle r="118" fill="none" stroke="url(#tokenGrad)" stroke-width="10"/>
    <circle r="96" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
    <text y="-8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#ffffff">1B</text>
    <text y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#aeb8d0" letter-spacing="4">TOKENS</text>
  </g>

  <text y="400" text-anchor="middle" x="600" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" fill="#ffffff">1 BILLION FREE TOKENS</text>
  <text y="452" text-anchor="middle" x="600" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="500" fill="#aeb8d0">Muse AI Invite Code — Step-by-Step Guide</text>

  <g transform="translate(600,540)">
    <rect x="-150" y="-34" width="300" height="60" rx="30" fill="url(#tokenGrad)"/>
    <text y="9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0a0e1a">INVOTIC.COM</text>
  </g>
</svg>
