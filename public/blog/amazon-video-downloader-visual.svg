<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Amazon Video Downloader — bulk-download Amazon creator videos</title>
  <desc id="svgDesc">Free Chrome extension: scan any Amazon creator storefront and bulk-download videos and images with metadata. By INVOTIC.</desc>
  <defs>
    <radialGradient id="amberGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff9900" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="50%" cy="62%" r="55%">
      <stop offset="0%" stop-color="#ff0000" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="playGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ff0000"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.015"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a0e1a"/>
  <rect width="1200" height="630" fill="url(#amberGlow)"/>
  <rect width="1200" height="630" fill="url(#redGlow)"/>

  <!-- browser card -->
  <g transform="translate(600,215)">
    <rect x="-330" y="-110" width="660" height="220" rx="20" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
    <rect x="-330" y="-110" width="660" height="52" rx="20" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="-292" cy="-84" r="8" fill="#ff5f57"/>
    <circle cx="-268" cy="-84" r="8" fill="#febc2e"/>
    <circle cx="-244" cy="-84" r="8" fill="#28c840"/>
    <rect x="-220" y="-98" width="380" height="28" rx="14" fill="#ffffff" fill-opacity="0.08"/>
    <text x="-205" y="-78" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#aeb8d0">amazon.com/shop/creator…</text>
    <!-- play button -->
    <circle cx="0" cy="18" r="52" fill="url(#playGrad)"/>
    <polygon points=" -14,-8  -14,44  26,18 " fill="#ffffff"/>
    <!-- film strip dots -->
    <g fill="#ffffff" fill-opacity="0.25">
      <rect x="-300" y="70" width="26" height="18" rx="3"/>
      <rect x="-262" y="70" width="26" height="18" rx="3"/>
      <rect x="-224" y="70" width="26" height="18" rx="3"/>
      <rect x="198" y="70" width="26" height="18" rx="3"/>
      <rect x="236" y="70" width="26" height="18" rx="3"/>
      <rect x="274" y="70" width="26" height="18" rx="3"/>
    </g>
  </g>

  <text y="400" text-anchor="middle" x="600" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800" fill="#ffffff">AMAZON VIDEO DOWNLOADER</text>
  <text y="452" text-anchor="middle" x="600" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="500" fill="#aeb8d0">Bulk-download any Amazon creator’s videos — free Chrome extension</text>

  <g transform="translate(600,540)">
    <rect x="-150" y="-34" width="300" height="60" rx="30" fill="url(#playGrad)"/>
    <text y="9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0a0e1a">INVOTIC.COM</text>
  </g>
</svg>
