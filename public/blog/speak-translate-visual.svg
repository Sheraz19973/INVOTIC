<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Speak and Translate — Urdu voice to English text Chrome extension</title>
  <desc id="svgDesc">A free Chrome extension: speak or type in Urdu and get polished English instantly, built by Sheraz Khan at INVOTIC.</desc>
  <defs>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0000" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2ff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#00f2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2ff"/>
      <stop offset="100%" stop-color="#ff0000"/>
    </linearGradient>
    <linearGradient id="micGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f2ff"/>
      <stop offset="100%" stop-color="#0090a0"/>
    </linearGradient>
    <linearGradient id="cardSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#050505"/>
  <ellipse cx="200" cy="560" rx="420" ry="260" fill="url(#redGlow)"/>
  <ellipse cx="1020" cy="80" rx="380" ry="220" fill="url(#cyanGlow)"/>
  <circle cx="1050" cy="480" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5"/>
  <circle cx="1050" cy="480" r="260" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1.5"/>
  <circle cx="130" cy="140" r="120" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5"/>

  <!-- top badge -->
  <g>
    <rect x="80" y="56" width="300" height="44" rx="22" fill="#ff0000"/>
    <text x="230" y="85" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="20" font-weight="700" letter-spacing="3" fill="#ffffff">FREE CHROME EXTENSION</text>
  </g>
  <g opacity="0.85">
    <rect x="900" y="56" width="220" height="44" rx="22" fill="none" stroke="#00f2ff" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="1010" y="85" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="19" font-weight="600" letter-spacing="2" fill="#00f2ff">AI-POWERED</text>
  </g>

  <!-- LEFT card : Urdu input -->
  <g>
    <rect x="80" y="150" width="400" height="280" rx="26" fill="#0f0f12" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>
    <rect x="80" y="150" width="400" height="280" rx="26" fill="url(#cardSheen)"/>
    <text x="120" y="196" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="17" font-weight="700" letter-spacing="4" fill="#00f2ff">URDU INPUT</text>
    <!-- mic -->
    <circle cx="150" cy="282" r="38" fill="url(#micGrad)"/>
    <g fill="none" stroke="#050505" stroke-width="6" stroke-linecap="round">
      <rect x="140" y="258" width="20" height="34" rx="10" fill="#050505" stroke="none"/>
      <path d="M132 288 v6 a18 18 0 0 0 36 0 v-6"/>
      <line x1="150" y1="312" x2="150" y2="322"/>
    </g>
    <!-- Urdu text -->
    <text x="440" y="292" text-anchor="end" font-family="'Segoe UI',Tahoma,Arial,sans-serif" font-size="44" font-weight="700" fill="#ffffff">اردو میں بولیں</text>
    <!-- waveform -->
    <g fill="#00f2ff" opacity="0.9">
      <rect x="120" y="340" width="8" height="26" rx="4"/>
      <rect x="136" y="332" width="8" height="42" rx="4"/>
      <rect x="152" y="344" width="8" height="18" rx="4"/>
      <rect x="168" y="328" width="8" height="50" rx="4"/>
      <rect x="184" y="338" width="8" height="30" rx="4"/>
      <rect x="200" y="348" width="8" height="14" rx="4" fill="#ff0000"/>
      <rect x="216" y="330" width="8" height="46" rx="4"/>
      <rect x="232" y="342" width="8" height="22" rx="4"/>
      <rect x="248" y="334" width="8" height="38" rx="4"/>
      <rect x="264" y="346" width="8" height="16" rx="4"/>
      <rect x="280" y="336" width="8" height="34" rx="4" fill="#ff0000"/>
      <rect x="296" y="344" width="8" height="20" rx="4"/>
      <rect x="312" y="332" width="8" height="42" rx="4"/>
      <rect x="328" y="348" width="8" height="14" rx="4"/>
      <rect x="344" y="338" width="8" height="30" rx="4"/>
      <rect x="360" y="330" width="8" height="46" rx="4" fill="#ff0000"/>
      <rect x="376" y="342" width="8" height="22" rx="4"/>
      <rect x="392" y="336" width="8" height="34" rx="4"/>
      <rect x="408" y="346" width="8" height="16" rx="4"/>
      <rect x="424" y="340" width="8" height="26" rx="4"/>
    </g>
    <text x="120" y="404" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="17" fill="#9a9aa3">Voice or Roman Urdu typing</text>
  </g>

  <!-- arrow -->
  <g>
    <circle cx="600" cy="290" r="46" fill="#00f2ff" opacity="0.12" filter="url(#soft)"/>
    <line x1="520" y1="290" x2="660" y2="290" stroke="url(#arrowGrad)" stroke-width="7" stroke-linecap="round"/>
    <path d="M640 268 L672 290 L640 312" fill="none" stroke="#ff0000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="520" cy="290" r="7" fill="#00f2ff"/>
  </g>

  <!-- RIGHT card : English output -->
  <g>
    <rect x="720" y="150" width="400" height="280" rx="26" fill="#0f0f12" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>
    <rect x="720" y="150" width="400" height="280" rx="26" fill="url(#cardSheen)"/>
    <text x="760" y="196" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="17" font-weight="700" letter-spacing="4" fill="#ff4d4d">ENGLISH OUTPUT</text>
    <text x="760" y="252" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="33" font-weight="700" fill="#ffffff">Get polished English,</text>
    <text x="760" y="294" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="33" font-weight="700" fill="#ffffff">instantly.</text>
    <g fill="#ffffff" opacity="0.16">
      <rect x="760" y="322" width="320" height="12" rx="6"/>
      <rect x="760" y="346" width="260" height="12" rx="6"/>
      <rect x="760" y="370" width="290" height="12" rx="6"/>
    </g>
    <circle cx="1052" cy="392" r="26" fill="#00f2ff"/>
    <path d="M1041 392 l8 8 l16 -18" fill="none" stroke="#050505" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- bottom title -->
  <text x="600" y="520" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="66" font-weight="800" letter-spacing="1" fill="#ffffff">SPEAK <tspan fill="#ff0000">&amp;</tspan> TRANSLATE</text>
  <text x="600" y="560" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="22" fill="#9a9aa3">Speak or type in Urdu — use perfect English anywhere on the web.</text>
  <text x="600" y="600" text-anchor="middle" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="18" font-weight="600" letter-spacing="1" fill="#5a5a63">Built by Sheraz Khan • INVOTIC</text>
</svg>
